# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup=xyz.shelltime.jetbrains
pluginName=ShellTime
pluginRepositoryUrl=https://github.com/shelltime/coding-extension-jetbrains
# Release Please bumps the version between these markers in its release PR
# x-release-please-start-version
pluginVersion=0.0.5
# x-release-please-end

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# No until-build, so a new IDE release doesn't drop the plugin from the Marketplace
pluginSinceBuild=241

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html#intellij-platform-extension
platformType=IC
platformVersion=2024.3.5

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
platformBundledPlugins=Git4Idea

# Gradle Configuration
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

# Kotlin Configuration
kotlin.stdlib.default.dependency=false
kotlin.code.style=official
